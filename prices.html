<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff7a00"><title>מחירון · מינימרקט אור</title><link rel="icon" href="img/icon-512.png"><link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="common.css"><link rel="stylesheet" href="lists.css"></head><body><div id="app">
<div class="top"><div class="row"><a class="back" href="index.html">→ חזרה</a><img src="img/logo.png" alt="מינימרקט אור"></div>
<h1 class="chunky">מחירון</h1><input class="search" id="q" type="search" placeholder="🔍 חפשו מוצר…" autocomplete="off"></div>
<div class="chips" id="chips"></div><div class="list" id="list"><div class="empty">טוען…</div></div>
<a class="fbbtn" id="fb" target="_blank" rel="noopener"></a></div>
<script type="module">
import {loadTab,price,esc,safeImg,FB,FB_SVG} from './sheet.js';import './common.js';
const $=id=>document.getElementById(id);$('fb').href=FB;$('fb').innerHTML=FB_SVG+'עקבו אחרינו בפייסבוק';
const {rows,src}=await loadTab('מוצרים');let cat='הכל';
const items=rows.map(r=>({n:r[0]||'',p:price(r[1]),img:safeImg(r[2]),c:(r[3]||'').trim()})).filter(x=>x.n);
const cats=['הכל',...new Set(items.map(x=>x.c).filter(Boolean))];
$('chips').innerHTML=cats.map(c=>`<button class="chip${c==cat?' on':''}">${esc(c)}</button>`).join('');
$('chips').onclick=e=>{if(e.target.classList.contains('chip')){cat=e.target.textContent;[...$('chips').children].forEach(b=>b.classList.toggle('on',b.textContent==cat));draw()}};
function draw(){const q=$('q').value.trim();const f=items.filter(x=>(cat=='הכל'||x.c==cat)&&(!q||x.n.includes(q)||x.c.includes(q)));
 $('list').innerHTML=(f.length?f.map(x=>`<div class="item"><div class="ph">${x.img?`<img loading="lazy" src="${esc(x.img)}" alt="">`:'🛒'}</div><h3>${esc(x.n)}</h3><div class="cat">${esc(x.c)}</div>
  ${x.p?`<div class="pr">${esc(x.p)}</div>`:'<div class="pr na">מחיר יעודכן בקרוב</div>'}</div>`).join(''):'<div class="empty">לא נמצאו מוצרים 🤷</div>')
  +`<div class="note">${src=='live'?'המחירון מתעדכן ישירות מהחנות':'מוצג מידע שמור · יתעדכן כשיהיה חיבור'} · המחירים בחנות קובעים</div>`}
$('q').oninput=draw;draw();
</script></body></html>
