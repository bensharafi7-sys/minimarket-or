<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ff7a00"><title>מגדל אור · מבית מינימרקט אור</title>
<meta property="og:title" content="מגדל אור – משחקים מבית מינימרקט אור"><meta property="og:description" content="שוד העגלה ומגדל אור – שחקו, צברו מטבעות ושברו שיאים!">
<meta property="og:image" content="img/og.jpg">
<link rel="icon" href="img/icon-512.png"><link rel="apple-touch-icon" href="img/icon-512.png"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="common.css">
<style>
#app{background:radial-gradient(120% 70% at 50% 0%,#ffd08a 0%,#ff9a2e 45%,#ff7a00 100%);direction:rtl;overflow-y:auto;touch-action:pan-y}
body{touch-action:pan-y}
.rays{position:absolute;inset:-50%;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.13) 0 8deg,transparent 8deg 20deg);animation:spin 40s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.wrap{position:relative;padding:18px 18px 28px;min-height:100%;display:flex;flex-direction:column;align-items:center}
.top{width:100%;display:flex;justify-content:space-between;align-items:center}
.wallet{background:linear-gradient(#262626,#0d0d0d);border:3px solid #fff;border-radius:999px;color:#ffb347;font-weight:900;font-size:20px;padding:4px 14px;box-shadow:0 4px 10px rgba(0,0,0,.3)}
.hlogo{width:44%;max-width:200px;margin-top:4px;filter:drop-shadow(0 10px 16px rgba(120,40,0,.45));animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-2deg)}}
h1{margin:6px 0 0;font-size:clamp(64px,21vw,104px);text-align:center}
.sub{margin-top:14px;background:#111;color:#fff;font-weight:800;font-size:19px;padding:6px 18px;border-radius:999px;border:3px solid #fff;box-shadow:0 5px 12px rgba(0,0,0,.3)}
.sub b{color:#ff9a2e}
.games{width:100%;display:flex;flex-direction:column;gap:16px;margin-top:22px}
.g{position:relative;display:flex;align-items:stretch;background:#fff;border-radius:26px;border:4px solid #111;box-shadow:0 7px 0 #111,0 14px 24px rgba(120,40,0,.35);text-decoration:none;color:#111;overflow:hidden;min-height:150px}
.g:active{transform:translateY(5px);box-shadow:0 2px 0 #111}
.g .th{width:42%;background-size:cover;background-position:center 70%;border-left:4px solid #111}
.g .tx{flex:1;padding:12px 14px;display:flex;flex-direction:column;justify-content:center}
.g h3{margin:0;font-size:30px;font-weight:900;color:#ff7a00;text-shadow:0 2px 0 #111}
.g p{margin:4px 0 8px;font-weight:600;font-size:14px;color:#444}
.g .meta{display:flex;justify-content:space-between;align-items:center}
.g .bst{font-weight:800;font-size:14px}
.g .play{background:linear-gradient(#ffa53a,#ff7a00);color:#fff;font-weight:900;border-radius:14px;padding:7px 16px;box-shadow:0 4px 0 #a33f00}
.badge{position:absolute;top:10px;right:10px;background:#e8262b;color:#fff;font-weight:900;font-size:12px;padding:3px 9px;border-radius:999px;transform:rotate(-6deg);border:2px solid #fff}
.foot{margin-top:22px;text-align:center;color:#fff;font-weight:700;text-shadow:0 2px 4px rgba(0,0,0,.35)}
.foot a{display:inline-block;margin-top:8px;background:#fff;color:#111;text-decoration:none;font-weight:900;padding:8px 18px;border-radius:999px;border:3px solid #111;text-shadow:none}
.cp{margin-top:14px;width:100%;background:#fff6ec;border:3px dashed #111;border-radius:18px;padding:10px;text-align:center;font-weight:800}
</style></head><body><div id="app"><div class="rays"></div><div class="wrap">
<div class="top"><div class="wallet" id="wallet">🪙 0</div><div class="rbtn dark" id="mute" style="position:static;width:48px;height:48px;font-size:22px">🔊</div></div>
<img class="hlogo" src="img/logo.png" alt="מינימרקט אור">
<h1 class="chunky">מגדל <span class="w">אור</span></h1>
<div class="sub">מבית <b>מינימרקט אור</b></div>
<div class="games">
 <a class="g" href="cart.html"><div class="th" style="background-image:url(img/thumb_cart.jpg)"></div><div class="badge">חדש!</div>
  <div class="tx"><h3>שוד העגלה</h3><p>רוצו עם העגלה בין המדפים, התחמקו מהסבתא ואספו מוצרים!</p><div class="meta"><span class="bst" id="b_cart">🏆 0</span><span class="play">שחקו ◀</span></div></div></a>
 <a class="g" href="tower.html"><div class="th" style="background-image:url(img/thumb_tower.jpg)"></div>
  <div class="tx"><h3>מגדל אור</h3><p>הקישו, הפילו ובנו את מגדל המוצרים הכי גבוה!</p><div class="meta"><span class="bst" id="b_tower">🏆 0 ס"מ</span><span class="play">שחקו ◀</span></div></div></a>
</div>
<div class="cp">🎁 קופון למינימרקט אור – בקרוב!<div style="font-weight:500;font-size:14px">אספו מטבעות במשחקים, והם יחכו לכם</div></div>
<div class="foot">מינימרקט אור · מחכים לכם בחנות<br><a href="tel:03-9443449">📞 03-9443449</a></div>
</div></div>
<script type="module">
import {store,sfx,audioUnlock} from './common.js';
const $=id=>document.getElementById(id);
$('wallet').textContent='🪙 '+store.coins();$('b_cart').textContent='🏆 '+store.best('cart');$('b_tower').textContent='🏆 '+store.best('tower')+' ס"מ';
const m=$('mute');const upd=()=>m.textContent=store.muted?'🔇':'🔊';upd();m.onclick=()=>{store.muted=!store.muted;upd();audioUnlock();sfx.click()};
</script></body></html>
