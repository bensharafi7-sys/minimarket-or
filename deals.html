<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff7a00"><title>מבצעי השבוע · מינימרקט אור</title><link rel="icon" href="img/icon-512.png"><link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="common.css"><link rel="stylesheet" href="lists.css"></head><body><div id="app">
<div class="top"><div class="row"><a class="back" href="index.html">→ חזרה</a><img src="img/logo.png" alt="מינימרקט אור"></div>
<h1 class="chunky">מבצעי <span class="w">השבוע</span></h1></div>
<div class="list" id="list"><div class="empty">טוען…</div></div>
<a class="fbbtn" id="fb" target="_blank" rel="noopener"></a></div>
<script type="module">
import {loadTab,price,esc,safeImg,FB,FB_SVG} from './sheet.js';import './common.js';
const $=id=>document.getElementById(id);$('fb').href=FB;$('fb').innerHTML=FB_SVG+'מבצעים חמים בפייסבוק שלנו';
const {rows,src}=await loadTab('מבצעים');
const today=new Date();today.setHours(0,0,0,0);
function pd(s){s=(s||'').trim();if(!s)return null;let m=s.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})$/);if(m)return new Date((m[3].length==2?'20':'')+m[3],m[2]-1,m[1]);
 m=s.match(/Date\((\d+),(\d+),(\d+)\)/);if(m)return new Date(m[1],m[2],m[3]);const d=new Date(s);return isNaN(d)?null:d}
const deals=rows.map(r=>({t:(r[0]||'').trim(),p:price(r[1]),u:pd(r[2]),us:(r[2]||'').trim(),img:safeImg(r[3])}))
 .filter(x=>x.t&&!x.t.includes('למחוק')&&!(x.u&&x.u<today));
$('list').innerHTML=(deals.length?deals.map(x=>`<div class="item deal"><div class="rib">מבצע!</div><div class="ph">${x.img?`<img loading="lazy" src="${esc(x.img)}" alt="">`:'<span style="font-size:60px">🔥</span>'}</div>
 <div class="tx"><h3>${esc(x.t)}</h3>${x.p?`<div class="pr" style="margin:0">${esc(x.p)}</div>`:'<div class="pr na" style="align-self:flex-start">מחיר יעודכן בקרוב</div>'}
 ${x.us?`<div class="until">⏳ בתוקף עד ${esc(x.u?x.u.toLocaleDateString('he-IL'):x.us)}</div>`:''}</div></div>`).join('')
 :`<div class="empty">🔥 מבצעי השבוע יעלו בקרוב!<br><span style="font-weight:600;font-size:15px">בינתיים – בואו לחנות או התקשרו: <a href="tel:03-9443449">03-9443449</a></span></div>`)
 +`<div class="note">${src=='live'?'המבצעים מתעדכנים ישירות מהחנות':'מוצג מידע שמור · יתעדכן כשיהיה חיבור'} · עד גמר המלאי</div>`;
</script></body></html>
